spring.application.name=brandier-api

### Database ###
spring.datasource.url=jdbc:postgresql://localhost:5432/nome_do_banco
spring.datasource.username=usuario_do_banco
spring.datasource.password=senha-do-banco
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

### JWT ###
jwt.secret=
jwt.expiration=
jwt.refresh-expiration=
brandier.cookie.secure=true

### Mail ###
brandier.mail.enabled=true
brandier.mail.from=Brandier <nao-responder@exemplo.com>
spring.mail.host=smtp.exemplo.com
spring.mail.port=587
spring.mail.username=usuario-smtp
spring.mail.password=senha-smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

### Cadastro ###
brandier.base-url=https://exemplo.com
brandier.verification.token-expiration-hours=24
brandier.verification.resend-cooldown-seconds=60
brandier.email.block-disposable=true

### Server ###
server.port=8080
server.servlet.context-path=/api
server.error.whitelabel.enabled=false

### Actuator ###
management.server.port=9090
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

### Logs ###
logging.file.name=logs/application.log