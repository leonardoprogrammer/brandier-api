spring.application.name=brandier-api

### Database ###
spring.datasource.url=jdbc:postgresql://localhost:5432/nome_do_banco
spring.datasource.username=usuario_do_banco
spring.datasource.password=senha-do-banco
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

### JWT ###
jwt.secret=
jwt.expiration=
jwt.refresh-expiration=
brandier.cookie.secure=true

### Mail ###
brandier.mail.enabled=true
brandier.mail.from=Brandier <nao-responder@exemplo.com>
spring.mail.host=smtp.exemplo.com
spring.mail.port=587
spring.mail.username=usuario-smtp
spring.mail.password=senha-smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

### Cadastro ###
brandier.base-url=https://exemplo.com
brandier.verification.token-expiration-hours=24
brandier.verification.resend-cooldown-seconds=60
brandier.email.block-disposable=true
brandier.password-reset.token-expiration-minutes=30
brandier.password-reset.request-cooldown-seconds=60

### Rate limit ###
brandier.rate-limit.enabled=true
brandier.rate-limit.login-ip=20
brandier.rate-limit.login-email=10
brandier.rate-limit.login-window-minutes=15
brandier.rate-limit.signup-ip=5
brandier.rate-limit.recovery-ip=10
brandier.rate-limit.recovery-email=3
brandier.rate-limit.token-ip=20
brandier.rate-limit.window-minutes=60

### Cleanup ###
brandier.cleanup.enabled=true
brandier.cleanup.cron=0 30 3 * * *
brandier.cleanup.pending-account-max-age-days=7

### Server ###
server.port=8080
server.servlet.context-path=/api
server.error.whitelabel.enabled=false

### Actuator ###
management.server.port=9090
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

### Logs ###
logging.file.name=logs/application.log